presubmits:

  - name: pull-testcontainers-lint
    always_run: true
    decorate: true
    clone_uri: "https://github.com/kcp-dev/kcp-testcontainers"
    labels:
      preset-goproxy: "true"
    spec:
      containers:
        - image: ghcr.io/kcp-dev/infra/build:1.26.10-1
          command:
            - make
            - lint
            - lint-readme
          resources:
            requests:
              memory: 1Gi
              cpu: 1

  - name: pull-testcontainers-verify
    always_run: true
    decorate: true
    clone_uri: "https://github.com/kcp-dev/kcp-testcontainers"
    labels:
      preset-goproxy: "true"
    spec:
      containers:
        - image: ghcr.io/kcp-dev/infra/build:1.26.10-1
          command:
            - make
            - verify
          resources:
            requests:
              memory: 1Gi
              cpu: 1

  - name: pull-testcontainers-test
    always_run: true
    decorate: true
    clone_uri: "https://github.com/kcp-dev/kcp-testcontainers"
    labels:
      preset-goproxy: "true"
    spec:
      containers:
        - image: ghcr.io/kcp-dev/infra/build:1.26.10-1
          command:
            - make
            - test
          resources:
            requests:
              memory: 1Gi
              cpu: 1
